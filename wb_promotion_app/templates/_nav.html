    <div class="nav-brand">
        <a href="/">🎯 WB Promotion</a>
    </div>
    <div class="nav-links">
        <a href="/" class="nav-link{% if current_page == 'index' %} active{% endif %}">Кампании</a>
        {% if is_authenticated %}
        <a href="/profile" class="nav-link{% if current_page == 'profile' %} active{% endif %}">👤 Профиль</a>

        <a href="/login" class="nav-link{% if current_page == 'login' %} active{% endif %}">🔐 Вход</a>

    <div class="user-greeting">
