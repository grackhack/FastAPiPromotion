<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кампания #{{ campaign_id }} - Wildberries Promotion</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .campaign-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .campaign-actions {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }
        .nm-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">
                <a href="/">🎯 WB Promotion</a>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">Кампании</a>
                <a href="/profile" class="nav-link">Профиль</a>
                <a href="/logout" class="nav-link">Выйти</a>
            </div>
        </nav>

        <main class="main">
            <div class="campaign-header">
                <a href="/" class="btn btn-secondary">← Назад к списку</a>
                <h2 style="margin: 0;">Кампания #<span id="campaignId">{{ campaign_id }}</span></h2>
                <div class="campaign-actions">
                    <a href="/stats/campaign/{{ campaign_id }}" class="btn btn-primary">📈 Статистика</a>
                    <a href="/campaigns/{{ campaign_id }}/minus-phrases" class="btn btn-secondary">🚫 Минус-фразы</a>
                </div>
            </div>

            <div id="campaignInfo" class="campaign-info-block">
                <!-- Информация о кампании -->
            </div>

            <div class="nm-section">
                <div class="nm-section-header">
                    <h3 style="margin: 0;">Товары в кампании</h3>
                </div>
                <div class="table-container">
                    <table class="nm-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Название</th>
                                <th style="width: 120px;">Ставка</th>
                                <th style="width: 150px;">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="nmTableBody">
                            <!-- Данные загружаются через JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Wildberries Promotion Manager</p>
        </footer>
    </div>

    <!-- Данные кампании для JS -->
    <script id="campaign-data" type="application/json">
        {{ campaign_json | safe }}
    </script>

    <script src="/static/js/campaign-detail.js?v=20"></script>
</body>
</html>
