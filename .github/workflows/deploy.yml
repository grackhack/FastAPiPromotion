name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/FastAPiPromotion

            # Pull latest changes
            git fetch origin
            git reset --hard origin/master

            # Install dependencies
            source .venv/bin/activate
            pip install -e .

            # Stop old process
            pkill -f "uvicorn main:app" || true
            sleep 2

            # Create start script
            cat > ~/FastAPiPromotion/start_app.sh << 'SCRIPT'
            #!/bin/bash
            cd ~/FastAPiPromotion/wb_promotion_app
            exec ../.venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8001
            SCRIPT
            chmod +x ~/FastAPiPromotion/start_app.sh

            # Run in background using nohup with proper detachment
            nohup bash ~/FastAPiPromotion/start_app.sh > ~/FastAPiPromotion/app.log 2>&1 &
            disown -a

            # Wait and verify
            sleep 8
            # Check by port 8001 instead of command line
            if ss -tlnp | grep ':8001 ' > /dev/null || pgrep -f "port 8001" > /dev/null || pgrep -f "main:app" > /dev/null; then
              echo "✅ Application started successfully on port 8001"
              curl -s http://localhost:8001/ | head -3
            else
              echo "❌ Application failed to start"
              echo "=== App log ==="
              cat ~/FastAPiPromotion/app.log | tail -30
              echo "=== Process list ==="
              ps aux | grep -E "uvicorn|python" | grep -v grep
              exit 1
            fi
