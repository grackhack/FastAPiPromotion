name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/FastAPiPromotion

            # Pull latest changes
            git fetch origin
            git reset --hard origin/master

            # Install dependencies
            source .venv/bin/activate
            pip install -e .

            # Restart application via systemd (botuser can restart own services)
            systemctl --user daemon-reload
            systemctl --user restart wb-promotion-app

            # Wait and verify
            sleep 5
            # Check by port 8001
            if ss -tlnp | grep ':8001 ' > /dev/null; then
              echo "✅ Application started successfully on port 8001"
              curl -s http://localhost:8001/ | head -3
            else
              echo "❌ Application failed to start"
              echo "=== User systemd status ==="
              systemctl --user status wb-promotion-app --no-pager | tail -20
              echo "=== Journal logs ==="
              journalctl --user -u wb-promotion-app --no-pager -n 30
              exit 1
            fi
