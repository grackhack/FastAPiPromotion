name: Deploy to Production

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/FastAPiPromotion

            echo "🔄 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/master

            echo "📦 Installing dependencies..."
            source .venv/bin/activate
            pip install -e .
            pip install -r wb_promotion_app/requirements.txt

            echo "🗄️ Running database migrations..."
            cd wb_promotion_app
            alembic upgrade head
            cd ..

            echo "🔄 Restarting application..."
            systemctl --user daemon-reload
            systemctl --user restart wb-promotion-app

            echo "⏳ Waiting for application to start..."
            sleep 5

            echo "✅ Checking application status..."
            if ss -tlnp | grep ':8001 ' > /dev/null; then
              echo "✅ Application started successfully on port 8001"
              curl -s http://localhost:8001/ | head -3
              echo ""
              echo "✅ Deployment completed successfully!"
            else
              echo "❌ Application failed to start"
              echo ""
              echo "=== Service status ==="
              systemctl --user status wb-promotion-app --no-pager | tail -20
              echo ""
              echo "=== Recent logs ==="
              journalctl --user -u wb-promotion-app --no-pager -n 30
              exit 1
            fi
